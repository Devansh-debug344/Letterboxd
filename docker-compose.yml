services:
  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    expose:
      - "8000"

    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2

    restart: unless-stopped