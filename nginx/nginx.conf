events {}

http {
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name devansh.online www.devansh.online;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name devansh.online www.devansh.online;

        ssl_certificate /etc/letsencrypt/live/devansh.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devansh.online/privkey.pem;

        location / {
            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}